[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archery-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Archery: inspect production schema and check release SQL through your own Archery platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "itzhouq" }]
keywords = ["archery", "mcp", "mcp-server", "database", "sql", "mysql", "postgresql", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.26,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/itzhouq/archery-mcp"
Repository = "https://github.com/itzhouq/archery-mcp"
Issues = "https://github.com/itzhouq/archery-mcp/issues"
Changelog = "https://github.com/itzhouq/archery-mcp/blob/main/CHANGELOG.md"

[project.scripts]
archery-mcp = "archery_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archery_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
